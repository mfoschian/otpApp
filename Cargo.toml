[package]
name = "otpApp"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
base64 = "0.22"
hex = "0.4"
rpassword = "7.3"
aes-gcm = { version = "0.11.1", features = ["aes"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
data-encoding = "2.6"


[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }

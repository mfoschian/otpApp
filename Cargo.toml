[package]
name = "aegis_reader"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
base64 = "0.22"
hex = "0.4"
rpassword = "7.3"
aes-gcm = { version = "0.11.1", features = ["aes"] }
